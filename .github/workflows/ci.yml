name: CI - Monolito y Microservicios
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monolito:
    runs-on: ubuntu-latest
    env:
      DB_NAME: proyecto_app
      DB_USER: app_user
      DB_PASSWORD: app123
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir e iniciar monolito
        run: docker compose up -d --build
        working-directory: monolito

      - name: Esperar a que PostgreSQL esté listo
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U app_user -d proyecto_app; then
              break
            fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U app_user -d proyecto_app
          docker compose exec -T db psql -U app_user -d proyecto_app -c '\dt'
        working-directory: monolito

      - name: Ejecutar pruebas
        run: docker compose exec -T app npm test
        working-directory: monolito

      - name: Mostrar registros si falla
        if: failure()
        run: docker compose logs
        working-directory: monolito

      - name: Detener contenedores
        if: always()
        run: docker compose down -v
        working-directory: monolito
  microservicios:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Construir e iniciar microservicios
        run: docker compose up -d --build
        working-directory: microservicios
      - name: Esperar a que las API respondan
        run: |
          for port in 3001 3002 3003; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://localhost:$port/health" >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -fsS "http://localhost:$port/health"
          done
      - name: Probar Usuarios
        run: docker compose exec -T usuarios npm test
        working-directory: microservicios

      - name: Probar Productos
        run: docker compose exec -T productos npm test
        working-directory: microservicios

      - name: Probar Pedidos
        run: docker compose exec -T pedidos npm test
        working-directory: microservicios
      - name: Mostrar registros si falla
        if: failure()
        run: docker compose logs
        working-directory: microservicios
      - name: Detener contenedores
        if: always()
        run: docker compose down -v
        working-directory: microservicios
